[package]
name = "github-client"
version = "0.1.0"
description = "Fast desktop client for GitHub"
authors = ["Yi Tam"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "github_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
keyring = "4"
tauri-plugin-process = "2"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
